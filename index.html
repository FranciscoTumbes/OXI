<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNT - Sistema de Propuestas | Ley 29230</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- SIDEBAR: DATOS MAESTROS -->
<aside id="master-sidebar">
    <div class="sidebar-header">
        <h2>🎓 UNT - Propuestas</h2>
        <p class="subtitle">Ley N° 29230 - Obras por Impuestos</p>
    </div>

    <div class="sidebar-section">
        <h3>📋 Datos del Proceso</h3>
        <div class="m-group">
            <label>Nomenclatura:</label>
            <input type="text" id="m_proceso" value="PROCESO DE SELECCIÓN N.° 01-2026-CE-OXI-UNT">
        </div>
        <div class="m-group">
            <label>Código CUI:</label>
            <input type="text" id="m_cui" value="2710525" maxlength="7">
        </div>
        <div class="m-group">
            <label>Nombre del Proyecto:</label>
            <textarea id="m_proyecto" rows="3">MEJORAMIENTO DEL SERVICIO DE GESTIÓN INSTITUCIONAL EN EDUCACIÓN SUPERIOR UNIVERSITARIA EN COMEDOR UNIVERSITARIO DISTRITO DE TUMBES DE LA PROVINCIA DE TUMBES DEL DEPARTAMENTO DE TUMBES</textarea>
        </div>
        <div class="m-group">
            <label>Comité:</label>
            <input type="text" id="m_comite" value="COMITÉ ESPECIAL – Ley N° 29230">
        </div>
        <div class="m-group">
            <label>Entidad Pública:</label>
            <input type="text" id="m_entidad" value="UNIVERSIDAD NACIONAL DE TUMBES">
        </div>
        <div class="m-group">
            <label>Dirección:</label>
            <textarea id="m_direccion" rows="2">CIUDAD UNIVERSITARIA NRO. S/N (BARRIO PAMPA GRANDE) TUMBES - TUMBES - TUMBES</textarea>
        </div>
        <div class="m-group">
            <label>Lugar y Fecha:</label>
            <input type="text" id="m_fecha" value="Tumbes, 05 de agosto de 2026">
        </div>
    </div>

    <div class="sidebar-section">
        <h3>🏢 Datos del Postor</h3>
        <div class="m-group">
            <label>Postor / Consorcio:</label>
            <input type="text" id="m_postor" placeholder="Razón social completa">
        </div>
        <div class="m-group">
            <label>RUC:</label>
            <input type="text" id="m_ruc" maxlength="11" placeholder="20100000001">
        </div>
        <div class="m-group">
            <label>Representante Legal:</label>
            <input type="text" id="m_representante" placeholder="Apellidos y Nombres">
        </div>
        <div class="m-group">
            <label>DNI Representante:</label>
            <input type="text" id="m_dni_rep" maxlength="8" placeholder="12345678">
        </div>
        <div class="m-group">
            <label>Correo Electrónico:</label>
            <input type="email" id="m_email" placeholder="postor@empresa.com">
        </div>
    </div>

    <nav class="nav-anexos">
        <h3>📑 Anexos</h3>
        <button class="nav-btn active" onclick="mostrarAnexo('dash')">📊 Dashboard</button>
        <button class="nav-btn" onclick="mostrarAnexo('4a')">4-A: Expresión de Interés</button>
        <button class="nav-btn" onclick="mostrarAnexo('4b')">4-B: Contenido Sobres</button>
        <button class="nav-btn" onclick="mostrarAnexo('4c')">4-C: Acreditación</button>
        <button class="nav-btn" onclick="mostrarAnexo('4d')">4-D: Info Financiera</button>
        <button class="nav-btn" onclick="mostrarAnexo('4e')">4-E: Propuesta Económica</button>
        <button class="nav-btn" onclick="mostrarAnexo('4g')">4-G: Declaración Jurada</button>
        <button class="nav-btn" onclick="mostrarAnexo('4h')">4-H: Compromiso Ejecutora</button>
        <button class="nav-btn" onclick="mostrarAnexo('4k')">4-K: Declaración Consorcio</button>
        <button class="nav-btn" onclick="mostrarAnexo('4l')">4-L: Personal Profesional</button>
        <button class="nav-btn" onclick="mostrarAnexo('4m')">4-M: Compromiso Personal</button>
    </nav>

    <div class="action-btns">
        <button class="btn btn-success" onclick="guardarPropuesta()">💾 Guardar en BD</button>
        <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir / PDF</button>
        <button class="btn btn-warning" onclick="exportarJSON()">📤 Exportar JSON</button>
    </div>
</aside>

<!-- CANVAS: DOCUMENTOS -->
<main id="canvas">
    <!-- El contenido de los anexos se mantiene idéntico al mostrado en el widget -->
    <!-- ... (Anexos 4-A hasta 4-M con mismas estructuras) ... -->
</main>

<script src="js/app.js"></script>
</body>
</html>
